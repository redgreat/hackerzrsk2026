# 通用客户服务评分表（满分 100 = 各维度 score/5 × 权重之和 − 求助扣分）
id: customer_service
name: 客户服务评分表
hint_penalty: 2
hint_penalty_max: 10
dimensions:
  - name: 开场与服务意识
    weight: 15
    good: 礼貌简洁，主动承担沟通责任，让客户感到被认真对待
    bad: 机械问候、语气生硬或把问题推给其他岗位
  - name: 倾听与需求澄清
    weight: 25
    good: 用简洁问题确认场景、现象和客户真正诉求，并复述确认
    bad: 没问清楚就猜测、打断客户或只按关键词套话术
  - name: 解答与方案准确性
    weight: 25
    good: 回答针对当前问题，步骤清楚，不编造、不越权
    bad: 答非所问、信息含糊或承诺无法保证的结果
  - name: 情绪与预期管理
    weight: 15
    good: 识别客户情绪，说明边界，给出具体且可兑现的时间节点
    bad: 与客户争辩，使用“尽快”等空泛表述
  - name: 表达与合规
    weight: 10
    good: 口语清晰、通俗，保护客户信息并遵守业务权限
    bad: 堆砌术语、泄露信息或作违规承诺
  - name: 结束与闭环
    weight: 10
    good: 确认客户是否理解，复述下一步并约定回访
    bad: 没有确认结果就草草结束
