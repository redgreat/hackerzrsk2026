# 服务器部署用：镜像来自 GHCR（由 .github/workflows/build-deploy.yml 在打 v* 标签时构建推送）。
# 部署脚本：script/redeploy.sh [--tag vX.Y.Z] [--migrate]
# 根目录 .env 需包含 POSTGRES_PASSWORD；backend/.env 为应用配置（见 backend/.env.example）。
# 企业微信要求 HTTPS 可信域名，请在前面加反向代理（Nginx/Caddy）转发到 127.0.0.1:8000。

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在根目录 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ai_coach
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach -d ai_coach"]
      interval: 5s
      retries: 10

  app:
    image: ${APP_IMAGE:-ghcr.io/redgreat/hackerzrsk2026:latest}
    restart: unless-stopped
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://coach:${POSTGRES_PASSWORD}@db:5432/ai_coach
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
