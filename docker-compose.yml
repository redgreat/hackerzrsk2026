# 服务器部署用：镜像来自 quay.io（由 .github/workflows/build-deploy.yml 在打 v* 标签时构建推送）。
# 数据库为云上 PostgreSQL，连接信息写在 config/config.yml 的 database_url 中，本文件不含数据库服务。
# 配置读取：./config 以只读挂载到容器 /app/config，CONFIG_PATH 指向其中的 config.yml。
# 部署脚本：script/redeploy.sh [--tag vX.Y.Z] [--migrate]
# 企业微信要求 HTTPS 可信域名，请在前面加反向代理（Nginx/Caddy）转发到 127.0.0.1:8000。

services:
  app:
    image: quay.io/zrsk/hackerzrsk2026:latest
    container_name: hackerzrsk2026
    restart: unless-stopped
    init: true
    environment:
      - TZ=Asia/Shanghai
      - CONFIG_PATH=/app/config/config.yml
    volumes:
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
