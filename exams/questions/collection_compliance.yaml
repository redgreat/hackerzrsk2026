# 贷后催收合规与话术题库（通用行业规范整理，业务/合规部门确认后可增删）
# type: single 单选 / multi 多选 / judge 判断（options 可省略，默认 [正确, 错误]）；answer 为正确选项下标（从 0 开始）

- id: Q001
  type: single
  tags: [合规, 身份核实]
  stem: 电话接通后，在谈及欠款信息之前，坐席首先应该做什么？
  options: [直接告知欠款金额和逾期天数, 核实接听人是否为客户本人, 告知不还款的法律后果, 询问客户工作单位]
  answer: [1]
  explanation: 必须先核实本人身份，避免向第三方泄露债务信息。

- id: Q002
  type: judge
  tags: [合规, 第三方]
  stem: 客户家属接听电话时，为了促使家属帮忙催还，可以告诉家属客户的欠款金额。
  answer: [1]
  explanation: 不得向客户本人以外的任何第三方透露欠款金额、逾期等债务信息。

- id: Q003
  type: multi
  tags: [合规, 红线]
  stem: 以下哪些说法属于催收红线，绝对不能说？（多选）
  options: ["再不还就让你坐牢", "我们会把你欠钱的事告诉你单位领导", "逾期会如实上报征信，影响后续贷款", "我是法院的，已经给你立案了"]
  answer: [0, 1, 3]
  explanation: 威胁恐吓、向第三方施压、冒充司法人员都属于红线；如实告知征信影响是合规的。

- id: Q004
  type: single
  tags: [合规, 告知]
  stem: 关于逾期后果，以下哪种告知方式是合规的？
  options: ["不还钱我们马上派人上门把车拖走", "逾期记录会按规定报送征信，可能影响您后续办理贷款和信用卡", "你这种老赖早晚被抓", "今天不还明天就起诉你全家"]
  answer: [1]
  explanation: 如实、平和地告知合同约定和征信影响，不夸大、不威胁、不辱骂。

- id: Q005
  type: judge
  tags: [合规, 越权]
  stem: 客户说资金困难，坐席可以直接承诺“只要你今天还一半，罚息我给你全免了”。
  answer: [1]
  explanation: 坐席无权承诺减免，只能如实告知政策并按流程提交申请。

- id: Q006
  type: single
  tags: [合规, 投诉]
  stem: 客户情绪激动说“我要去投诉你们”，坐席最合适的回应是？
  options: ["你投诉也没用", "随便你，反正你欠钱", "非常抱歉给您带来困扰，投诉是您的权利，我也会把您的意见如实反馈。您看现在方便简单聊一下还款安排吗？", "直接挂断电话"]
  answer: [2]
  explanation: 尊重客户投诉权利、先安抚情绪，再回到还款话题，不对抗不挑衅。

- id: Q007
  type: multi
  tags: [话术, 还款承诺]
  stem: 一个完整、可跟进的还款承诺（PTP）应包含哪些要素？（多选）
  options: [具体金额, 具体日期/时间, 还款方式或渠道, 客户的家庭住址]
  answer: [0, 1, 2]
  explanation: 金额、时间、方式缺一不可；家庭住址与还款承诺无关，也不应索取。

- id: Q008
  type: single
  tags: [话术, 共情]
  stem: 客户说“我最近生意亏了，真没钱”，以下哪句回应最好？
  options: ["没钱也得还啊", "理解您现在的难处。方便说说大概什么时候会有回款吗？我们一起看看能先安排多少", "那你去借钱还", "别找借口了"]
  answer: [1]
  explanation: 先共情，再用开放式问题了解还款能力，引导客户给出可行方案。

- id: Q009
  type: judge
  tags: [话术, 收尾]
  stem: 客户承诺还款后，坐席复述一遍金额、时间和还款方式，有助于提高承诺兑现率。
  answer: [0]
  explanation: 复述能让客户再次确认，也便于后续跟进。

- id: Q010
  type: single
  tags: [话术, 拖延]
  stem: 客户第三次说“过几天就还”，此前两次承诺都没兑现。坐席最恰当的做法是？
  options: ["好的，那您过几天记得还", "用事实指出之前两次承诺未兑现，说明持续逾期的影响，并请客户给出具体日期和金额", "威胁客户再不还就上门", "直接挂断换下一个"]
  answer: [1]
  explanation: 有理有据地施压，并锁定具体的金额与日期，避免模糊承诺。

- id: Q011
  type: single
  tags: [合规, 时间]
  stem: 关于催收联系时间与频率，以下做法正确的是？
  options: ["凌晨也可以打，越早越好", "在合理时间段联系，避免频繁拨打骚扰客户", "一天打 20 次给客户压力", "同时给客户所有联系人轮流打电话"]
  answer: [1]
  explanation: 应在合理时间段、以合理频率联系，不得骚扰客户及其联系人。

- id: Q012
  type: multi
  tags: [合规, 第三方]
  stem: 第三方（如家属）接听时，坐席可以说的有哪些？（多选）
  options: ["我是某某公司的工作人员", "有业务需要刘先生本人处理，麻烦请他回电", "他欠了我们八千多块", "请问他什么时间方便接电话？"]
  answer: [0, 1, 3]
  explanation: 可以说明机构身份并请其转告回电，但不能透露任何债务信息。

- id: Q013
  type: judge
  tags: [话术, 开场]
  stem: 开场时自报机构名称和工号，可以降低客户“怀疑是诈骗电话”的顾虑。
  answer: [0]
  explanation: 规范的自我介绍能建立信任，也是合规要求。

- id: Q014
  type: single
  tags: [话术, 质疑金额]
  stem: 客户质疑“我明明还过了，你们乱收费”，坐席首先应该？
  options: ["坚持说系统没错", "先核实客户的还款记录，再按合同条款解释欠款构成", "告诉客户不还就起诉", "答应帮客户免掉差额"]
  answer: [1]
  explanation: 先核实、再解释，用数据说话；不能越权免除，也不能与客户争执。

- id: Q015
  type: multi
  tags: [话术, 情绪管理]
  stem: 面对情绪激动的客户，以下哪些做法是正确的？（多选）
  options: [先致歉并接住情绪, 保持语速平稳、音量适中, 和客户比谁嗓门大, 等客户情绪缓和后再谈还款]
  answer: [0, 1, 3]
  explanation: 先处理情绪再处理事情，不对抗。

- id: Q016
  type: judge
  tags: [合规, 录音]
  stem: 催收通话中可以使用“你就是个骗子”“老赖”等称呼让客户重视还款。
  answer: [1]
  explanation: 辱骂、侮辱客户属于红线行为。

- id: Q017
  type: single
  tags: [话术, 首逾]
  stem: 对按时还款 18 期、本期首次逾期 3 天的客户，沟通重点应该是？
  options: ["严厉警告，让客户害怕", "以提醒和服务为主，了解原因并约定当天或次日还款", "直接转入法务流程", "不打电话，等客户自己还"]
  answer: [1]
  explanation: 首逾客户多为忘还或临时周转，以友好提醒为主，快速锁定还款时间。

- id: Q018
  type: single
  tags: [合规, 身份]
  stem: 以下哪种自我介绍是违规的？
  options: ["您好，我是车贷贷后服务中心的，工号 1024", "您好，我是某某公司客户服务部的", "您好，我是某某区法院的，你的案子已经立案了", "您好，打扰您了，我是您车贷业务的服务专员"]
  answer: [2]
  explanation: 冒充公检法或法院工作人员属于红线。

- id: Q019
  type: multi
  tags: [话术, 能力了解]
  stem: 客户说暂时还不上时，坐席可以了解哪些信息来判断还款能力？（多选）
  options: [逾期的原因, 近期的收入或回款时间, 能先还的金额, 客户亲友的欠款情况]
  answer: [0, 1, 2]
  explanation: 聚焦客户本人的原因、收入与可还金额；不打听与本合同无关的第三方信息。

- id: Q020
  type: judge
  tags: [话术, 收尾]
  stem: 通话结束前告知客户还款渠道和下次联系时间，是规范收尾的一部分。
  answer: [0]
  explanation: 规范收尾包括复述承诺、告知渠道、约定跟进。
