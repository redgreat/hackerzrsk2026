# 贷后催收评分表示例，未核验为公司正式制度；红线、权重与适用范围须经业务确认
id: collection_default
name: 贷后催收评分表
hint_penalty: 2
hint_penalty_max: 10
red_line_cap: 59
red_lines:
  - 威胁、恐吓客户（如扬言抓人、坐牢、上门、曝光、伤害人身财产）
  - 辱骂、侮辱、人身攻击客户（如称客户“老赖”“骗子”）
  - 冒充公检法、律师或法院工作人员，或虚构诉讼、立案等后果
  - 向客户本人以外的第三方（家属、同事、紧急联系人）透露欠款金额、逾期等债务信息
  - 未核实身份就透露欠款信息
  - 越权承诺减免罚息、本金或停止催收
dimensions:
  - name: 开场与身份核实
    weight: 15
    good: 礼貌自报机构与工号，先核实是否本人再谈欠款，说明来电目的
    bad: 一上来就报欠款金额，未核实身份，语气生硬
  - name: 情绪管理与共情
    weight: 20
    good: 客户抱怨或激动时先接住情绪，不争吵，语气平稳专业
    bad: 与客户对抗、打断、讽刺，被客户情绪带着走
  - name: 逾期原因与还款能力了解
    weight: 20
    good: 用开放式问题了解逾期原因、收入状况、可还款时间，区分忘还/困难/恶意拖欠
    bad: 不问原因只催“赶紧还”，或被客户一句“没钱”打发
  - name: 合规告知与施压分寸
    weight: 20
    good: 如实、平和告知逾期对征信与合同的影响及后续流程，施压有理有据不越界
    bad: 夸大后果、威胁恐吓，或完全不告知影响
  - name: 达成还款承诺
    weight: 15
    good: 敲定具体金额、日期和还款方式（PTP），必要时给出合规范围内的分次方案
    bad: 以“尽快”“过几天”收尾，没有可跟进的承诺
  - name: 结束确认与跟进
    weight: 10
    good: 复述承诺内容，告知还款渠道和下次联系时间，礼貌结束
    bad: 草草挂断，没有复述和约定
