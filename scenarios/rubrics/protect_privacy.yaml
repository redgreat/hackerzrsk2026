id: protect_privacy
name: 隐私保护与转告评分表
dimensions:
  - name: 讲清隐私边界
    weight: 45
    good: 礼貌解释业务信息需要本人核实
    bad: 对家属披露业务详情或用含糊话暗示欠款
  - name: 给出清楚的转告
    weight: 35
    good: 请家属转告本人通过已知的官方客服入口联系
    bad: 要求家属协助处理欠款或缺少安全的联系方式
  - name: 确认并结束
    weight: 20
    good: 确认家属愿意转达，简短结束
    bad: 未确认是否愿转达，或继续追问无关信息
red_lines:
  - 向未经授权的第三方披露客户借款、欠款、金额或业务进度
  - 要求未经授权的第三方代为付款或提供客户证件信息
