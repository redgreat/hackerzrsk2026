id: verify_debit
name: 扣款核对评分表
dimensions:
  - name: 承接疑问
    weight: 20
    good: 接住客户对重复扣款的担心，说明会一起核对
    bad: 敷衍或直接否定客户看到的记录
  - name: 核对状态
    weight: 45
    good: 说明仅一笔已入账，引导查看两条银行交易各自的状态
    bad: 单凭入账记录断定银行不存在第二笔扣款
  - name: 明确核查路径
    weight: 35
    good: 约定出现两笔成功记录时通过官方入口提交凭证核查，并说明从哪里查看进度
    bad: 无操作步骤或擅自保证退款
