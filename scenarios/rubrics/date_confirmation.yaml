id: date_confirmation
name: 日期核实短练习评分表
hint_penalty: 2
hint_penalty_max: 10
dimensions:
  - name: 核实能否按期还款
    weight: 35
    good: 主动向客户核实坐席方提出的目标日期能否打款
    bad: 没有向客户核实，或把目标日期当成客户给出的日期
  - name: 如实复述
    weight: 35
    good: 明确复述二十号能否打款仍待确认，请客户确认理解是否正确
    bad: 将待确认的日期记为客户承诺，或诱导客户保证
  - name: 明确跟进
    weight: 30
    good: 与客户协商可执行的核实时间、方式及反馈事项
    bad: 只说之后再联系，或者擅自承诺结果
