id: verify_payment
name: 还款进度核查评分表
dimensions:
  - name: 核对已做操作
    weight: 35
    good: 引导客户确认银行转账状态
    bad: 一看系统未入账便断定客户没付款
  - name: 说明进度边界
    weight: 30
    good: 分清银行端显示成功、系统暂未入账与最终处理结论
    bad: 保证马上到账或让客户再付一笔
  - name: 确认当通动作
    weight: 35
    good: 说明从官方入口提交原交易凭证核查，并确认客户愿意操作
    bad: 只说会处理或直接声称客户已提交
