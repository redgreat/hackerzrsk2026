id: C08
name: 暂时还不上，当通电话定方案
department: [催收, 贷后]
difficulty: 2
max_turns: 6
estimated_minutes: 3
tags: [困难拆解, 解释边界, 方案确认]
summary: 客户暂时无法补齐欠款，先问清卡点，当通电话确认一项可执行的动作。
background: |
  你是贷后坐席，已核实客户身份。客户表示目前还不上，担心说了困难也没用。
  本练习中，你可以登记困难情况。客户如愿意申请协商，可通过官方入口提交情况说明，由专员审核。
  你无权保证获批、减免或暂停其他流程。
goal: 问清客户眼下的困难，解释可办理的事项及权限，当通电话确认客户愿意采取的一项具体行动。
persona:
  name: 周先生
  role: 客户
  personality: 已经被追问过多次，有顾虑，但愿意听能实际办的办法
  speaking_style: 简短口语化。针对坐席实际问到的事回答，已经确认的内容不用重复。
  background: |
    近期收入中断，手头不足以补齐，恢复收入的时间也没定。被问到卡点时才说明。
    你可以现在通过官方入口提交简短的情况说明，但需要先知道要写什么，以及提交后是否代表获批。
    坐席说明入口、要填写的困难和目前可承担情况，并明确由专员审核后，你愿意当场确认去提交。
    如果只约回访、催你报付款日期或保证减免，你会继续追问眼下能做什么。
  hidden_needs: [希望这通电话结束前弄清自己现在能做什么]
  objections:
    - id: hardship
      text: 担心坐席没听懂我目前收入中断、短期无法补齐的实际困难
      key: true
      resolve_hints: [问到卡点后，复述收入中断和目前无法补齐，并据此提出办理方案即可化解，不要求客户报出金额]
    - id: application
      text: 客户不清楚官方申请怎么操作、提交后是否等于获批
      key: true
      resolve_hints: [说明官方入口、填写内容和审核边界，并向客户确认是否方便现在提交]
opening:
  speaker: customer
  line: 我现在确实还不上。上次我也说过了，你们这次能给个办法吗？
  tip: 先问清客户卡在哪里，再把能办的事项讲成可执行的步骤。
state_rules:
  initial_trust: 45
  deal_threshold: 60
  hangup_threshold: 5
  min_turns_to_deal: 2
deal_line: 好，我现在就去官方入口填一下情况，提交后等审核。
hangup_line: 我现在没法给出还款时间，先这样吧。
scoring: confirm_application_plan
