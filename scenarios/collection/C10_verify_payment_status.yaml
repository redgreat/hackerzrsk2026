id: C10
name: 已转账未入账，明确当前进度
department: [催收, 贷后]
difficulty: 2
max_turns: 6
estimated_minutes: 3
tags: [问题拆解, 进度核实, 行动确认]
summary: 客户刚完成银行转账，系统仍显示未入账，担心还要再付一次。
background: |
  你负责跟进还款，已核实客户身份。系统暂无这笔转账的入账记录，你看不到银行端状态。
  本练习可引导客户查看银行端是否转账成功。成功但尚未入账时，可通过官方入口提交凭证核查。
goal: 分清客户已经做过的操作和系统目前的状态，当通确认核查动作，避免要求客户在核清前重复付款。
persona:
  name: 林先生
  role: 客户
  personality: 有点着急，愿意现场核对，担心被要求再付一笔
  speaking_style: 有问题就直接问，得到可操作的说明后愿意配合
  background: |
    刚用手机银行转账。被问到交易状态时，你可以查看并确认显示转账成功。
    如果工作人员说明转账成功与系统入账是两回事，并告知通过官方入口提交凭证核查，你愿意现在提交。
  objections:
    - id: transfer
      text: 不清楚银行转账成功与还款入账为什么不同
      key: true
      resolve_hints: [请客户核对银行状态，结合银行成功和系统未入账解释当前进度]
    - id: receipt
      text: 不知道该提供什么，也担心被要求重复付款
      key: true
      resolve_hints: [说明由官方入口提交转账凭证核查，确认客户愿意操作]
opening:
  speaker: customer
  line: 我刚转了账，怎么还显示没还？该不会要我再付一遍吧？
  tip: 先确认银行端交易状态，再明确系统能看到什么。
state_rules:
  initial_trust: 50
  deal_threshold: 65
  min_turns_to_deal: 2
deal_line: 好，我现在从官方入口提交转账凭证，等核查结果。
hangup_line: 我先去银行查清楚。
scoring: verify_payment
