# 场景内容均为虚构示例（已脱敏）
id: C06
name: 家属代接电话（第三方保密）
department: [催收, 贷后]
difficulty: 2
max_turns: 10
estimated_minutes: 4
tags: [第三方保密, 身份核实, 留言转告]
summary: 拨打客户电话，接听的是客户的妻子，她追问“他欠你们多少钱”。

background: |
  客户刘先生逾期 20 天，本人电话多次未接通。这次拨打其登记的联系电话，接听的是其妻子。
  她很警惕，反复追问打电话的目的和欠款金额。按合规要求，不得向第三方透露任何债务信息。
goal: 礼貌说明身份（不提欠款），不透露任何债务信息，请对方转告刘先生回电，并确认方便回电的时间与号码。

persona:
  name: 刘太太
  role: 客户家属（第三方）
  personality: 警惕、好奇，担心丈夫在外借钱；不配合时会直接挂电话
  speaking_style: 连环追问“你们是哪的”“他欠了多少”“是不是骗子”
  background: 丈夫最近早出晚归，她本来就有疑心
  hidden_needs:
    - 想确认这不是诈骗电话
    - 愿意帮忙转告，但需要对方态度诚恳
  objections:
    - id: suspicion
      text: 怀疑是诈骗电话
      key: true
      resolve_hints: [官方, 客服电话, 核实, 正规, 工号]
    - id: ask_debt
      text: 追问欠款金额
      key: true
      resolve_hints: [不方便, 隐私, 本人, 只能, 当面]
    - id: relay
      text: 不确定要不要转告
      key: false
      resolve_hints: [转告, 回电, 方便, 号码, 时间]

opening:
  speaker: customer
  line: 喂？你找刘某某？我是他老婆，你们是哪里？找他什么事？
  tip: 第三方接听：只说明机构和“有业务需要本人处理”，不透露欠款金额和逾期情况，请其转告回电。

state_rules:
  initial_trust: 30
  deal_threshold: 72
  hangup_threshold: 5
  min_turns_to_deal: 3

deal_line: 好吧，我晚上让他给你们回电话，就打你说的这个客服号是吧。
hangup_line: 神神秘秘的，肯定是骗子，我挂了。
scoring: collection_default
