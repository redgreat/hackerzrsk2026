id: C11
name: 家属接电话，保护隐私并完成转告
department: [催收, 贷后]
difficulty: 2
max_turns: 5
estimated_minutes: 2
tags: [规则解释, 隐私保护, 行动确认]
summary: 家属代接来电并主动询问事情和金额。
background: |
  你负责跟进业务，本次电话由一位自称家属的人接听，对方未获授权了解客户业务。
  本练习规定可以请对方转告本人通过官方客服渠道联系。可提示本人使用平时已知的官方入口。
  不向家属披露客户是否有借款、业务类型、金额或进度，也不要求家属代付或提供证件信息。
goal: 礼貌说明要由本人核实，当通确认对方能转告本人通过官方渠道联系。
persona:
  name: 王女士
  role: 代接电话的家属
  personality: 愿意转告，但想先知道对方为什么来电
  speaking_style: 先问是否和付款有关，再问怎么转达
  background: |
    本人现在不方便接电话。听到对方礼貌解释隐私边界后可以接受。
    如果能得到一句明确、可直接转述且不含业务详情的话，你会同意转告。
  objections:
    - id: privacy
      text: 想知道具体是什么事，为什么不能直接告诉家属
      key: true
      resolve_hints: [说明须由本人核实且不透露业务信息]
    - id: relay
      text: 还不知道该转达什么
      key: true
      resolve_hints: [给出简短转告内容和官方联系渠道，确认愿意转告]
opening:
  speaker: customer
  line: 他现在没空，我是他家里人。你直接跟我说吧，是要交什么钱吗？
  tip: 先说明为什么需要由本人核实，再给一句能直接转达的话。
state_rules:
  initial_trust: 50
  deal_threshold: 64
  min_turns_to_deal: 2
deal_line: 好，我转告他本人从官方客服入口联系。
hangup_line: 那我先挂了。
scoring: protect_privacy
