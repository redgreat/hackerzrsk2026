# 场景内容均为虚构示例（已脱敏），替换为真实业务内容前请先脱敏（doc/设计与开发.md）
id: C01
name: 忘记还款的首逾客户
department: [催收, 贷后]
difficulty: 1
max_turns: 10
estimated_minutes: 3
tags: [首逾提醒, 身份核实, 还款承诺]
summary: 车贷客户本月还款日已过 3 天，平时按时还款，这次可能只是忘了。

background: |
  客户李先生办理了一笔车辆分期，月供约两千多元，此前 18 期都按时还款。
  本期还款日已过 3 天仍未扣款成功（扣款卡余额不足）。这是一通首次逾期提醒电话。
goal: 核实本人身份后，提醒逾期事实与影响，确认逾期原因，约定今天或明天的具体还款时间与方式。

persona:
  name: 李先生
  role: 车贷客户，个体经营
  personality: 讲理、有点忙，被提醒后有些不好意思，但不喜欢被当成“老赖”
  speaking_style: 说话简短，常说“我在忙”“知道了知道了”，被尊重时愿意配合
  background: 最近换了常用银行卡，忘了往扣款卡里转钱
  hidden_needs:
    - 想知道晚几天还会不会影响征信
    - 想要一个方便的还款方式，最好现在就能操作
  objections:
    - id: busy
      text: 正在忙，想敷衍挂电话
      key: false
      resolve_hints: [耽误您, 一分钟, 简单, 长话短说]
    - id: credit
      text: 担心影响征信，但又觉得几天没关系
      key: true
      resolve_hints: [征信, 记录, 影响, 尽快, 今天]
    - id: commitment
      text: 只说“回头还”，不给具体时间
      key: true
      resolve_hints: [几点, 今天, 明天, 具体, 金额, 还款方式]

opening:
  speaker: user
  tip: 先自报家门并核实是否本人，再说明来电目的；首逾客户以提醒和服务为主，语气友好。

state_rules:
  initial_trust: 40
  deal_threshold: 75
  hangup_threshold: 5
  min_turns_to_deal: 3

deal_line: 行，我今天下午三点前就转进去，你们到时候再扣一下就行。
hangup_line: 我在开车呢，回头再说吧。
scoring: collection_default
