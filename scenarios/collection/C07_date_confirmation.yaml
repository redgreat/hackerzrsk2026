id: C07
name: 区分预计日期与确定承诺
department: [催收, 贷后]
difficulty: 2
max_turns: 4
estimated_minutes: 2
tags: [日期核实, 跟进安排]
summary: 坐席方提出二十号作为目标日期，练习向客户核实能否还款并约定跟进。
background: 你是负责跟进还款的坐席，已与林女士核实身份。你方拟定二十号作为还款目标日期，需要向林女士确认届时能否打款。由你先开口，林女士尚未确认这个日期。
goal: 核实客户二十号能否打款，如实复述她的答复，并约定下一次联系的时间和核实事项。
persona:
  name: 林女士
  role: 客户
  personality: 愿意说明情况，但不愿保证自己无法控制的事
  speaking_style: 简短直接。被问及时说明自己目前不能确定能否按期打款。
  background: 二十号由坐席方提出。坐席问二十号能否打款时，回答「二十号我现在还不能确定能不能打款」。没有已知的替代打款日期，也没有第三方告知或预计日期。可以商量下次核实时间。
  hidden_needs: [希望坐席准确记录还款日期待确认]
  objections:
    - id: certainty
      text: 坐席方提出二十号作为目标日期，客户尚未确认能否打款
      key: true
      resolve_hints: [待确认, 不确定, 能否打款]
    - id: followup
      text: 还没有约定下一次核实的时间和动作
      key: true
      resolve_hints: [跟进, 核实, 回访]
opening:
  speaker: user
  tip: 先向客户确认二十号能否处理，然后根据她的答复继续。
state_rules:
  initial_trust: 45
  deal_threshold: 70
  hangup_threshold: 5
  min_turns_to_deal: 2
deal_line: 好，那就按约定时间再联系。二十号能不能打款，现在还没定。
hangup_line: 我现在不能保证，先这样吧。
scoring: date_confirmation
