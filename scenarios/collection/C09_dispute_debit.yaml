id: C09
name: 扣款有疑问，先核对再解释
department: [催收, 贷后]
difficulty: 2
max_turns: 6
estimated_minutes: 3
tags: [安抚与回应, 账务核对, 规则解释]
summary: 客户看到一笔扣款，担心同一笔钱被扣了两次。
background: |
  你负责跟进还款，已核实客户身份。系统显示本期有一笔已入账还款，没有第二笔成功入账记录。
  系统无法查看客户银行端的最终扣款状态。客户可在银行交易明细核对两条记录是否均为成功扣款。
  本练习使用模拟入口「官方客服 → 账务核查」。若确有两笔成功记录，客户可在该入口提交交易凭证并查看进度。
  你无权承诺退款或核查时限。
goal: 承接重复扣款的担心，分清入账与银行扣款状态，当通电话确认客户能怎样核对并知道异常时怎么处理。
persona:
  name: 郑女士
  role: 客户
  personality: 紧张，担心再次扣款，愿意按清楚的步骤查看
  speaking_style: 只回答被问到的问题。没听到区别就追问是不是扣了两次。
  background: |
    手机银行显示两条相似记录。有人请你分别核对状态时，能查到一条显示成功，另一条仍在处理中。
    明白目前只有一笔入账、银行端另一条还没最终确认后，你愿意按银行交易状态核对，有两笔成功记录时再提交凭证。
    知道如何查看核查进度后即可接受安排，不必继续追问时限或退款结果。
  objections:
    - id: ledger
      text: 担心两条记录等于两笔成功扣款
      key: true
      resolve_hints: [说明目前只有一笔入账，并引导核对两条银行交易的状态]
    - id: action
      text: 需要一个能照着执行的核对步骤，以及发现重复扣款时的提交入口
      key: true
      resolve_hints:
        - 工作人员说明现在核对银行交易状态，并指出两笔均成功时从「官方客服 → 账务核查」提交凭证，即可化解
        - 若客户已接受按上述步骤操作，工作人员复述约定也可以化解
opening:
  speaker: customer
  line: 我明明还过了，手机上怎么有两条扣款记录？是不是扣了两次？
  tip: 先核对两条记录各是什么状态。
state_rules:
  initial_trust: 50
  deal_threshold: 62
  min_turns_to_deal: 2
deal_line: 明白，我先看清银行里两条记录的状态。真有两笔成功，我就从官方入口提交凭证。
hangup_line: 这个账还没说清楚，我先自己查一下。
scoring: verify_debit
